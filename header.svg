<svg width="1280" height="380" viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- base background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="0.5" stop-color="#0a1828"/>
      <stop offset="1" stop-color="#0c1d38"/>
    </linearGradient>

    <!-- glowing orbs -->
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#0c7fe0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0f2f8c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0f2f8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- text gradient (cyan -> light blue) -->
    <linearGradient id="gradtext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#4ab8ff"/>
    </linearGradient>

    <!-- subtle name sheen -->
    <linearGradient id="namegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4e9ff"/>
    </linearGradient>

    <!-- divider line glow -->
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00c8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>

    <!-- grid -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" stroke="#00c8ff" stroke-opacity="0.055" stroke-width="1" fill="none"/>
    </pattern>
    <radialGradient id="gridmask" cx="0.32" cy="0.45" r="0.62">
      <stop offset="0.1" stop-color="white"/>
      <stop offset="0.75" stop-color="#666"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
    <mask id="gm"><rect width="1280" height="380" fill="url(#gridmask)"/></mask>

    <!-- soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotglow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- background stack -->
  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#grid)" mask="url(#gm)"/>
  <ellipse cx="1010" cy="60" rx="420" ry="360" fill="url(#orb1)"/>
  <ellipse cx="150" cy="360" rx="360" ry="320" fill="url(#orb2)"/>
  <ellipse cx="780" cy="300" rx="240" ry="220" fill="url(#orb3)"/>

  <!-- eyebrow pill -->
  <g transform="translate(96,86)">
    <rect x="0" y="0" width="392" height="32" rx="16" fill="#00c8ff" fill-opacity="0.08" stroke="#00c8ff" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="20" cy="16" r="7" fill="#00c8ff" fill-opacity="0.25" filter="url(#dotglow)"/>
    <circle cx="20" cy="16" r="3.5" fill="#00c8ff"/>
    <text x="38" y="21" font-size="11.5" font-weight="700" letter-spacing="2" fill="#7fdcff">CTO &#183; AI SPECIALIST &#183; AUTOR &#183; MENTOR</text>
  </g>

  <!-- name -->
  <text x="92" y="206" font-size="76" font-weight="800" letter-spacing="-3" fill="url(#namegrad)">Fábio Magalhães</text>

  <!-- tagline: single text element, tspans keep spacing correct -->
  <text x="96" y="252" font-size="23" font-weight="400" fill="#9cb8d4">IA aplicada para <tspan font-weight="700" fill="url(#gradtext)">resultado no mundo real</tspan>.</text>

  <!-- divider -->
  <rect x="96" y="292" width="1088" height="1" fill="url(#line)"/>

  <!-- proof stats -->
  <g>
    <text x="96"  y="342" font-size="34" font-weight="800" fill="url(#gradtext)">20+</text>
    <text x="98"  y="362" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6a8caa">ANOS EM TECH</text>

    <rect x="232" y="320" width="1" height="44" fill="#00c8ff" fill-opacity="0.12"/>

    <text x="268" y="342" font-size="34" font-weight="800" fill="url(#gradtext)">7</text>
    <text x="270" y="362" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6a8caa">STARTUPS</text>

    <rect x="392" y="320" width="1" height="44" fill="#00c8ff" fill-opacity="0.12"/>

    <text x="428" y="342" font-size="34" font-weight="800" fill="url(#gradtext)">4</text>
    <text x="430" y="362" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6a8caa">MBAS</text>

    <rect x="520" y="320" width="1" height="44" fill="#00c8ff" fill-opacity="0.12"/>

    <text x="556" y="342" font-size="34" font-weight="800" fill="url(#gradtext)">1</text>
    <text x="558" y="362" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6a8caa">LIVRO</text>

    <rect x="648" y="320" width="1" height="44" fill="#00c8ff" fill-opacity="0.12"/>

    <text x="684" y="342" font-size="34" font-weight="800" fill="url(#gradtext)">2x</text>
    <text x="686" y="362" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6a8caa">PRÊMIO iBEST</text>
  </g>
</svg>
