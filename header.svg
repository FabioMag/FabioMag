<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="0.55" stop-color="#0a1828"/>
      <stop offset="1" stop-color="#0d2040"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0f2f8c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0f2f8c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradtext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#4ab8ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00c8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#00c8ff" stroke-opacity="0.05" stroke-width="1" fill="none"/>
    </pattern>
    <radialGradient id="gridmask" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0.2" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </radialGradient>
    <mask id="gm">
      <rect width="1280" height="360" fill="url(#gridmask)"/>
    </mask>
  </defs>

  <rect width="1280" height="360" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" mask="url(#gm)"/>
  <ellipse cx="980" cy="80" rx="380" ry="320" fill="url(#orb1)"/>
  <ellipse cx="180" cy="320" rx="340" ry="300" fill="url(#orb2)"/>

  <!-- eyebrow pill -->
  <g transform="translate(96,108)">
    <rect x="0" y="0" width="300" height="30" rx="15" fill="#00c8ff" fill-opacity="0.08" stroke="#00c8ff" stroke-opacity="0.22"/>
    <circle cx="18" cy="15" r="3.5" fill="#00c8ff"/>
    <text x="36" y="20" font-family="'Syne',sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#00c8ff">CTO · AI SPECIALIST · AUTOR · MENTOR</text>
  </g>

  <!-- name -->
  <text x="94" y="210" font-family="'Syne','Segoe UI',sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#ffffff">Fábio Magalhães</text>

  <!-- tagline with gradient accent -->
  <text x="96" y="258" font-family="'Inter','Segoe UI',sans-serif" font-size="22" font-weight="400" fill="#9cb8d4">IA aplicada para </text>
  <text x="316" y="258" font-family="'Inter','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="url(#gradtext)">resultado no mundo real</text>
  <text x="612" y="258" font-family="'Inter','Segoe UI',sans-serif" font-size="22" font-weight="400" fill="#9cb8d4">.</text>

  <!-- divider line -->
  <rect x="96" y="290" width="1088" height="1" fill="url(#line)"/>

  <!-- proof stats -->
  <g font-family="'Syne',sans-serif">
    <text x="96"  y="332" font-size="30" font-weight="700" fill="url(#gradtext)">20+</text>
    <text x="96"  y="350" font-family="'Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9cb8d4">ANOS EM TECH</text>

    <text x="290" y="332" font-size="30" font-weight="700" fill="url(#gradtext)">7</text>
    <text x="290" y="350" font-family="'Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9cb8d4">STARTUPS</text>

    <text x="430" y="332" font-size="30" font-weight="700" fill="url(#gradtext)">4</text>
    <text x="430" y="350" font-family="'Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9cb8d4">MBAS</text>

    <text x="540" y="332" font-size="30" font-weight="700" fill="url(#gradtext)">1</text>
    <text x="540" y="350" font-family="'Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9cb8d4">LIVRO</text>

    <text x="660" y="332" font-size="30" font-weight="700" fill="url(#gradtext)">2x</text>
    <text x="660" y="350" font-family="'Inter',sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#9cb8d4">PRÊMIO iBEST</text>
  </g>
</svg>
